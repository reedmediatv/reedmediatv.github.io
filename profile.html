<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پڕۆفایلەکەم - Reed Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #D91C24; --dark: #0B0F19; --white: #FFFFFF; --border: #E2E8F0; --bg: #F1F5F9; --text: #0F172A; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Arabic', 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        /* دەرکەوتەی سەرەوە */
        header { background-color: var(--white); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 900; color: var(--text); text-decoration: none; }
        .logo span { color: var(--red); }
        .logout-btn { background: #FEE2E2; color: var(--red); border: none; padding: 8px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: var(--red); color: var(--white); }

        /* لاشەی داشبۆرد */
        .dashboard-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 250px 1fr; gap: 30px; }
        @media (max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }
        
        /* مینیۆی لاتەنیشت */
        .sidebar { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px; height: fit-content; }
        .user-info { text-align: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed var(--border); }
        .avatar { width: 80px; height: 80px; background: var(--red); color: var(--white); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: 900; margin: 0 auto 10px; }
        .tab-btn { width: 100%; text-align: right; background: transparent; border: none; padding: 12px 15px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #64748B; cursor: pointer; margin-bottom: 5px; transition: 0.2s; }
        .tab-btn.active { background: var(--bg); color: var(--red); }
        .tab-btn:hover:not(.active) { background: #F8FAFC; color: var(--text); }

        /* بەشەکانی ناوەڕاست */
        .content-area { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
        .section-title { font-size: 20px; font-weight: 900; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--red); display: inline-block; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #F8FAFC; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--red); background: var(--white); }
        .form-group textarea { height: 120px; resize: vertical; }
        
        .save-btn { background: var(--dark); color: var(--white); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .save-btn:hover { background: var(--red); }

        /* شاردنەوەی تابەکان */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">میدیای <span>سوور</span></a>
        <button onclick="logout()" class="logout-btn">چوونە دەرەوە</button>
    </header>

    <div class="dashboard-container">
        <!-- لاتەنیشت (زانیاری کورت و مینیۆ) -->
        <div class="sidebar">
            <div class="user-info">
                <div class="avatar" id="user-avatar">R</div>
                <h3 id="display-name">بەکارهێنەر</h3>
                <p id="display-email" style="font-size: 12px; color: #64748B; margin-top: 5px;">user@example.com</p>
            </div>
            <button class="tab-btn active" onclick="switchTab('profile', this)">دەستکاری پڕۆفایل</button>
            <button class="tab-btn" onclick="switchTab('post', this)">نووسینی پۆست (بڵاوکردنەوە)</button>
        </div>

        <!-- بەشی ناوەڕاست -->
        <div class="content-area">
            
            <!-- تابی پڕۆفایل -->
            <div id="profile-tab" class="tab-content active">
                <h2 class="section-title">زانیارییەکانی پڕۆفایل</h2>
                <form onsubmit="saveProfile(event)">
                    <div class="form-group">
                        <label>ناوی تەواو</label>
                        <input type="text" id="edit-name" required>
                    </div>
                    <div class="form-group">
                        <label>ئیمەیڵ</label>
                        <input type="email" id="edit-email" required>
                    </div>
                    <div class="form-group">
                        <label>کورتەیەک لەسەر خۆت (Bio)</label>
                        <textarea id="edit-bio" placeholder="چەند وشەیەک لەسەر خۆت بنووسە..."></textarea>
                    </div>
                    <button type="submit" class="save-btn">پاشەکەوتکردنی گۆڕانکارییەکان</button>
                </form>
            </div>

            <!-- تابی پۆستکردن -->
            <div id="post-tab" class="tab-content">
                <h2 class="section-title">نووسینی بابەتێکی نوێ</h2>
                <div style="background: #FFFBEB; color: #B45309; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; border: 1px solid #FEF3C7;">
                    <strong>تێبینی:</strong> بۆ ئەوەی ئەم بابەتە ڕاستەوخۆ بڵاوبێتەوە، پێویستە سێرڤەری داتابەیس چالاک بکرێت. لە ئێستادا وەک (ڕەشنووس) لای خۆت خەزن دەبێت.
                </div>
                <form onsubmit="submitPost(event)">
                    <div class="form-group">
                        <label>ناونیشانی بابەت</label>
                        <input type="text" id="post-title" placeholder="ناونیشانێکی سەرنجڕاکێش بنووسە..." required>
                    </div>
                    <div class="form-group">
                        <label>بەشی هەواڵ</label>
                        <select id="post-category">
                            <option>بۆچوون و شیکاری</option>
                            <option>هەواڵی کوردستان</option>
                            <option>هەواڵی جیهان</option>
                            <option>ئابووری</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>دەقی بابەتەکە</label>
                        <textarea id="post-body" placeholder="بابەتەکەت لێرە بنووسە..." style="height: 200px;" required></textarea>
                    </div>
                    <button type="submit" class="save-btn" style="background: var(--red);">ناردن بۆ پێداچوونەوە</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        // پشکنینی لۆگین
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('reed_auth') !== 'true') {
                window.location.replace('login.html');
            } else {
                loadProfileData();
            }
        });

        // هێنانەوەی زانیارییەکان لە مۆبایلەکەوە
        function loadProfileData() {
            let name = localStorage.getItem('reed_user_name') || 'بەکارهێنەر';
            let email = localStorage.getItem('reed_user_email') || 'ئیمەیڵ نەدراوە';
            let bio = localStorage.getItem('reed_user_bio') || '';

            // دانانی لە مینیۆی لاتەنیشت
            document.getElementById('display-name').textContent = name;
            document.getElementById('display-email').textContent = email;
            document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();

            // دانانی لە فۆڕمەکە
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-email').value = email;
            document.getElementById('edit-bio').value = bio;
        }

        // سەیڤکردنی پڕۆفایل
        function saveProfile(e) {
            e.preventDefault();
            let newName = document.getElementById('edit-name').value;
            let newEmail = document.getElementById('edit-email').value;
            let newBio = document.getElementById('edit-bio').value;

            localStorage.setItem('reed_user_name', newName);
            localStorage.setItem('reed_user_email', newEmail);
            localStorage.setItem('reed_user_bio', newBio);

            loadProfileData();
            alert('زانیارییەکان بە سەرکەوتوویی نوێکرانەوە!');
        }

        // ناردنی پۆست (بۆ ئێستا بە خەیاڵی - Fake Submit)
        function submitPost(e) {
            e.preventDefault();
            alert('بابەتەکەت بە سەرکەوتوویی نێردرا! پاش پێداچوونەوەی ئەدمین بڵاودەکرێتەوە.');
            document.getElementById('post-title').value = '';
            document.getElementById('post-body').value = '';
        }

        // گۆڕینی تابەکان
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId + '-tab').classList.add('active');
            btn.classList.add('active');
        }

        // چوونە دەرەوە
        function logout() {
            localStorage.removeItem('reed_auth');
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
