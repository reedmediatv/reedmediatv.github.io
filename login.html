<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوە - Reed Media</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #D91C24; --dark: #0B0F19; --white: #FFFFFF; --border: #E2E8F0; --bg: #F1F5F9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Arabic', 'Inter', sans-serif; }
        body { background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .auth-container { background: var(--white); width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid var(--border); }
        .auth-header { text-align: center; padding: 30px 20px 20px; background: var(--dark); color: var(--white); border-bottom: 4px solid var(--red); }
        .logo { font-size: 26px; font-weight: 900; line-height: 1; }
        .logo span { color: var(--red); }
        .auth-desc { font-size: 13px; color: #94A3B8; margin-top: 8px; font-weight: 600; }
        
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .auth-tab { flex: 1; text-align: center; padding: 15px; font-weight: 800; color: #64748B; cursor: pointer; transition: 0.3s; background: #F8FAFC; border-bottom: 3px solid transparent; }
        .auth-tab.active { color: var(--red); background: var(--white); border-bottom-color: var(--red); }
        
        .auth-body { padding: 30px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; background: #F8FAFC; }
        .form-group input:focus { border-color: var(--red); background: var(--white); box-shadow: 0 0 0 3px rgba(217, 28, 36, 0.1); }
        
        .submit-btn { width: 100%; background: var(--red); color: var(--white); border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #B9181F; transform: translateY(-2px); }
        
        .guest-btn { width: 100%; background: transparent; color: #64748B; border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 15px; text-align: center; display: block; text-decoration: none; }
        .guest-btn:hover { background: #F1F5F9; color: var(--dark); }

        /* شاردنەوەی فۆڕمی دروستکردنی هەژمار لە سەرەتادا */
        #register-form { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">میدیای <span>سوور</span> | <span>Reed</span> Media</div>
            <div class="auth-desc">تکایە سەرەتا بچۆ ژوورەوە بۆ بینینی هەواڵەکان</div>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">چوونەژوورەوە</div>
            <div class="auth-tab" id="tab-register" onclick="switchTab('register')">خۆتۆمارکردن</div>
        </div>

        <div class="auth-body">
            <!-- فۆڕمی چوونەژوورەوە -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>ئیمەیڵ یان ناوی بەکارهێنەر</label>
                    <input type="text" id="login-email" placeholder="ئیمەیڵەکەت بنووسە" required>
                </div>
                <div class="form-group">
                    <label>وشەی تێپەڕ (پاسۆرد)</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn">چوونەژوورەوە</button>
            </form>

            <!-- فۆڕمی دروستکردنی هەژمار -->
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>ناوی تەواو</label>
                    <input type="text" id="reg-name" placeholder="ناوەکەت بنووسە" required>
                </div>
                <div class="form-group">
                    <label>ئیمەیڵ</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>وشەی تێپەڕ (پاسۆرد)</label>
                    <input type="password" id="reg-password" placeholder="لانی کەم ٦ پیت/ژمارە" required minlength="6">
                </div>
                <button type="submit" class="submit-btn">دروستکردنی هەژمار</button>
            </form>

            <!-- دوگمەی چوونەژوورەوە وەک میوان -->
            <button onclick="continueAsGuest()" class="guest-btn" type="button">دواتر ئەکاونت دروست دەکەم (میوان)</button>
        </div>
    </div>

    <script>
        // فەنکشنی گۆڕینی تابەکان لە نێوان لۆگین و ڕێجێستەر
        function switchTab(tab) {
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'none';

            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById(tab + '-form').style.display = 'block';
        }

        // فەنکشنی خۆتۆمارکردن
        function handleRegister(e) {
            e.preventDefault();
            let name = document.getElementById('reg-name').value;
            let email = document.getElementById('reg-email').value;
            
            // خەزنکردنی زانیارییەکان لەسەر مۆبایلی بەکارهێنەر
            localStorage.setItem('reed_auth', 'true');
            localStorage.setItem('reed_user_name', name);
            localStorage.setItem('reed_user_email', email);
            
            alert('بە سەرکەوتوویی هەژمارەکەت دروستکرا! بەخێربێیت ' + name);
            window.location.replace('index.html'); // ناردنی بۆ پەڕەی سەرەکی
        }

        // فەنکشنی چوونەژوورەوە
        function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('login-email').value;
            let savedEmail = localStorage.getItem('reed_user_email');

            if (savedEmail && email === savedEmail) {
                localStorage.setItem('reed_auth', 'true');
                window.location.replace('index.html');
            } else {
                localStorage.setItem('reed_auth', 'true');
                localStorage.setItem('reed_user_name', email.split('@')[0]); 
                window.location.replace('index.html');
            }
        }

        // فەنکشنی میوان
        function continueAsGuest() {
            localStorage.setItem('reed_auth', 'guest');
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
